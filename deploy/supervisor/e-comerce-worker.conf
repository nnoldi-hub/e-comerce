; /etc/supervisor/conf.d/e-comerce-worker.conf
; Dupa modificare: sudo supervisorctl reread && sudo supervisorctl update
; La fiecare deploy: php artisan queue:restart (workerul se reporneste singur)

[program:e-comerce-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/e-comerce/current/artisan queue:work --sleep=3 --tries=3 --backoff=10 --max-time=3600
directory=/var/www/e-comerce/current
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/e-comerce-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
