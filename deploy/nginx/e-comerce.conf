# /etc/nginx/sites-available/e-comerce.conf  (ln -s in sites-enabled)
# Inlocuieste magazin.example.ro si calea /var/www/e-comerce.
# Certificat: sudo certbot --nginx -d magazin.example.ro

server {
    listen 80;
    listen [::]:80;
    server_name magazin.example.ro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name magazin.example.ro;

    root /var/www/e-comerce/current/public;
    index index.php;
    charset utf-8;

    # ssl_certificate si ssl_certificate_key sunt adaugate de certbot.

    # Galeria de produs: 10 x 5 MB + marja (aliniat cu post_max_size din php.ini).
    client_max_body_size 64M;

    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Fisiere statice cu amprenta (Vite): cache lung.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Nimic ascuns nu se serveste (.env, .git etc.), cu exceptia .well-known.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
